<div class="flex w-full items-center">
  <button [type]="type" class="tw_btn_default"
    [ngClass]="[btnClass ? btnClass : '',isDisabled||loading?'!tw_btn_disabled':'',buttonType ==='outline' ?'!tw_btn_outline':'']"
    (click)="onBtnClick($event)" [disabled]="isDisabled">

    @if (loading) {
      <i class="fa fa-circle-o-notch !text-[24px] animate-spin text-[#FFFFFF]" aria-hidden="true"></i>
    }

    @if (!loading) {
      <span class="">{{label}}</span>
    }</button>
  </div>
